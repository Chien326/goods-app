<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOODS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f4f1ea'/><circle cx='16' cy='16' r='9' fill='none' stroke='%231a1a1a' stroke-width='2.5' stroke-dasharray='38 14'/><text x='16' y='22' font-size='15' text-anchor='middle' font-family='Georgia,serif' font-weight='bold' fill='%231a1a1a'>G</text></svg>">
    <style>
:root {
    /* 黑白极简手绘 */
    --ink: #1a1a1a;
    --ink-soft: #444;
    --ink-light: #888;
    --paper: #fafaf7;
    --paper-2: #f2f0ea;
    --line: #1a1a1a;
    --line-soft: #d8d4cb;
    --shadow: rgba(26, 26, 26, 0.08);
    --danger: #d63b3b;

    /* 手绘歪扭圆角 */
    --sketch-1: 225px 12px 240px 14px / 14px 240px 12px 225px;
    --sketch-2: 12px 240px 14px 225px / 225px 14px 240px 12px;
    --sketch-3: 200px 16px 220px 10px / 16px 220px 10px 200px;
    --sketch-4: 16px 220px 10px 200px / 200px 10px 220px 16px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Comic Sans MS", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe Print", cursive, sans-serif;
    background-color: var(--paper);
    background-image:
        radial-gradient(var(--line-soft) 1px, transparent 1.4px),
        radial-gradient(rgba(26,26,26,0.025) 1px, transparent 1px);
    background-size: 26px 26px, 13px 13px;
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
}

/* ===== 左侧固定导航栏 - 顶部品牌区（GOODS 居中） ===== */
.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px 16px;
    border-bottom: 3px solid var(--ink);
    position: relative;
}
.brand::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    height: 1.5px;
    border-bottom: 1.5px dashed var(--ink);
}
.brand-logo {
    height: 34px;
    width: auto;
    display: block;
}

.header-stats {
    display: flex;
    gap: 10px;
    margin-left: auto;
}

.stat-pill {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: var(--sketch-3);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
}
.stat-pill .stat-value {
    font-size: 17px;
    font-weight: 700;
}
.stat-pill.warning {
    background: var(--ink);
    color: var(--paper);
}

/* ===== Layout: 左侧固定导航 + 右侧主内容 ===== */

/* ===== Sidebar ===== */
.sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 300px;
    background: var(--paper);
    border-right: 3px solid var(--ink);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: auto;
    flex-shrink: 0;
    z-index: 20;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--line-soft); }

.search-box {
    padding: 18px 18px 14px;
    position: relative;
}
.search-box i {
    position: absolute;
    left: 34px; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-light);
    font-size: 14px;
}
.search-box input {
    width: 100%;
    padding: 11px 14px 11px 40px;
    border: 2px solid var(--ink);
    border-radius: var(--sketch-1);
    font-size: 14px;
    outline: none;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
}
.search-box input:focus {
    border-color: var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
}
.search-box input::placeholder { color: var(--ink-light); }

/* ===== Location Section ===== */
.location-section {
    flex: 1;
    padding: 8px 16px;
    overflow-y: auto;
}
.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 6px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 6px;
}
.section-header span { display: flex; align-items: center; gap: 6px; }

.location-tree { padding: 0 2px; }

.tree-node { margin: 6px 0; }

.tree-node-content {
    display: flex;
    align-items: center;
    padding: 9px 10px;
    border: 2px solid transparent;
    border-radius: var(--sketch-2);
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    gap: 6px;
}
.tree-node-content:hover {
    border-color: var(--ink);
    background: var(--paper-2);
}
.tree-node-content.active {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--paper);
    box-shadow: 3px 3px 0 var(--line-soft);
}
.tree-toggle {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--ink-light);
    transition: transform 0.2s; flex-shrink: 0;
}
.tree-toggle.expanded { transform: rotate(90deg); }
.tree-toggle.empty { visibility: hidden; }
.tree-icon { width: 24px; text-align: center; font-size: 14px; }
.tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-count {
    background: var(--paper-2);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px; font-weight: 700;
}
.tree-node-content.active .tree-count {
    background: var(--paper);
    color: var(--ink);
}
.tree-node-content.orphan-node {
    border: 1.5px dashed var(--ink-light);
    border-radius: var(--sketch-1);
    margin-top: 4px;
    opacity: 0.92;
}
.tree-node-content.orphan-node .tree-icon { color: var(--warning); }
.tree-node-content.orphan-node.active {
    background: rgba(251, 191, 36, 0.15);
    border-color: var(--ink);
}
.tree-node-content.floating-node {
    border: 1.5px dashed var(--ink-light);
    border-radius: var(--sketch-1);
    margin-top: 4px;
    opacity: 0.92;
}
.tree-node-content.floating-node .tree-label {
    font-style: italic;
    color: var(--ink-soft);
}
.tree-node-content.floating-node .tree-icon { color: var(--danger); }
.tree-node-content.floating-node.active {
    background: rgba(239, 68, 68, 0.08);
    border-color: var(--ink);
}
.orphan-badge {
    font-size: 11px; font-weight: 700;
    background: rgba(251, 191, 36, 0.25);
    border: 1.5px solid var(--ink);
    border-radius: 10px; padding: 1px 8px; margin-left: 6px;
    color: var(--ink);
}
.tree-actions {
    display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s;
}
.tree-node-content:hover .tree-actions { opacity: 1; }
.tree-action-btn {
    width: 26px; height: 26px;
    border: none; background: transparent; color: var(--ink-light);
    cursor: pointer; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: all 0.15s;
}
.tree-action-btn:hover { color: var(--ink); }
.tree-action-btn.delete:hover { color: var(--ink); font-weight: 700; }

.tree-children {
    margin-left: 16px; display: none; position: relative;
}
.tree-children.expanded { display: block; }
.tree-children::before {
    content: ""; position: absolute;
    left: 6px; top: 0; bottom: 8px;
    width: 2px;
    background-image: repeating-linear-gradient(to bottom, var(--ink) 0 4px, transparent 4px 9px);
}

/* ===== Quick Filters ===== */
.quick-filters {
    padding: 14px 18px;
    border-top: 3px solid var(--ink);
    display: flex; flex-direction: column; gap: 8px;
}
.filter-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px;
    border: 2px solid var(--ink);
    border-radius: var(--sketch-4);
    background: var(--paper);
    cursor: pointer; font-size: 14px;
    color: var(--ink); transition: all 0.15s;
    width: 100%; text-align: left; font-weight: 700;
    font-family: inherit;
}
.filter-btn:hover { box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px,-1px); }
.filter-btn.active { background: var(--ink); color: var(--paper); }

/* ===== Main Content ===== */
.main-content {
    margin-left: 300px;
    height: 100vh;
    display: flex; flex-direction: column;
    overflow: hidden; background: transparent;
}

/* 顶栏：右侧统计 */
.topbar {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 12px;
    padding: 14px 28px;
    min-height: 72px;
    border-bottom: 3px solid var(--ink);
    position: relative;
}
.topbar::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    height: 1.5px;
    border-bottom: 1.5px dashed var(--ink);
}

/* Tab Bar */
.tab-bar {
    display: flex; padding: 12px 24px; gap: 10px;
    border-bottom: 3px solid var(--ink);
}
.tab-btn {
    padding: 9px 20px;
    border: 2px solid var(--ink);
    background: var(--paper);
    cursor: pointer; font-size: 14px;
    color: var(--ink); font-weight: 700;
    display: flex; align-items: center; gap: 8px;
    border-radius: var(--sketch-1);
    transition: all 0.15s; font-family: inherit;
}
.tab-btn:hover { box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px,-1px); }
.tab-btn.active { background: var(--ink); color: var(--paper); }

/* ===== Tab Panels ===== */
.tab-panel { display: none; flex: 1; overflow-y: auto; padding: 24px; }
.tab-panel.active { display: block; }
.tab-panel::-webkit-scrollbar { width: 6px; }
.tab-panel::-webkit-scrollbar-thumb { background: var(--line-soft); }

.panel-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
}
.panel-toolbar h2 {
    font-size: 20px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
    letter-spacing: 0.5px;
}

/* ===== Items Grid ===== */
.items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
}
.item-card {
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: var(--sketch-1);
    padding: 20px;
    transition: all 0.2s;
    position: relative; overflow: hidden;
}
.item-card:nth-child(4n+2) { border-radius: var(--sketch-2); }
.item-card:nth-child(4n+3) { border-radius: var(--sketch-3); }
.item-card:nth-child(4n)   { border-radius: var(--sketch-4); }
.item-card:hover {
    box-shadow: 5px 5px 0 var(--ink);
    transform: translate(-2px,-2px) rotate(-0.4deg);
}
.item-card.low-stock {
    border-style: dashed;
    border-width: 3px;
}
.item-card.out-of-stock {
    border-width: 3px;
}
.item-card.orphan {
    border-style: dashed;
    background: rgba(251, 191, 36, 0.06);
}
.item-location.orphan-loc {
    color: var(--warning); font-style: italic;
}
.item-card.out-of-stock::after {
    content: "缺货";
    position: absolute;
    top: 14px; right: -28px;
    transform: rotate(38deg);
    background: var(--paper);
    color: var(--ink);
    border: 2.5px solid var(--ink);
    padding: 2px 34px;
    font-size: 13px; font-weight: 700;
    letter-spacing: 2px;
}

.item-card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 14px;
}
.item-name { font-size: 18px; font-weight: 700; }
.item-category {
    display: inline-block;
    background: var(--paper-2);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 2px 10px; border-radius: 10px;
    font-size: 11px; font-weight: 700; margin-top: 6px;
}
.item-actions { display: flex; gap: 5px; opacity: 0; transition: opacity 0.15s; }
.item-card:hover .item-actions { opacity: 1; }
.item-action-btn {
    width: 32px; height: 32px;
    border: 2px solid var(--ink);
    border-radius: 50%;
    background: var(--paper); color: var(--ink);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: all 0.15s; font-family: inherit;
}
.item-action-btn:hover { background: var(--ink); color: var(--paper); transform: scale(1.1); }

.item-quantity { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
.item-quantity .number { font-size: 36px; font-weight: 700; line-height: 1; }
.item-quantity .unit { font-size: 14px; color: var(--ink-soft); font-weight: 700; }

.item-location {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; font-weight: 700;
}
.item-location i { font-size: 12px; }

.item-stock-bar { margin-bottom: 16px; }
.stock-bar-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 700;
}
.stock-bar {
    height: 10px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 6px; overflow: hidden;
}
.stock-bar-fill { height: 100%; transition: width 0.3s; background: var(--ink); }
.stock-bar-fill.ok { background: repeating-linear-gradient(45deg, var(--ink) 0 6px, var(--paper-2) 6px 12px); }
.stock-bar-fill.low { background: repeating-linear-gradient(45deg, var(--ink) 0 4px, transparent 4px 9px); }
.stock-bar-fill.empty { background: var(--ink); }

.item-notes {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink-light); margin-bottom: 12px; font-weight: 700;
}

.item-stock-controls { display: flex; gap: 10px; }
.stock-btn {
    flex: 1; padding: 10px;
    border: 2px solid var(--ink);
    border-radius: var(--sketch-2);
    cursor: pointer; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s; background: var(--paper); color: var(--ink);
    font-family: inherit;
}
.stock-btn.in:hover { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--line-soft); }
.stock-btn.out:hover { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--line-soft); }
.stock-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ===== Empty State ===== */
.empty-state {
    text-align: center; padding: 60px 20px; color: var(--ink-light);
}
.empty-state svg { margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--ink); font-weight: 700; }
.empty-state p { font-size: 14px; margin-bottom: 16px; font-weight: 700; }

/* ===== History ===== */
.history-list {
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: var(--sketch-3);
    overflow: hidden;
}
.history-item {
    display: flex; align-items: center; padding: 14px 22px;
    border-bottom: 2px dashed var(--line-soft); gap: 14px; transition: background 0.15s;
}
.history-item:last-child { border-bottom: none; }
.history-item:hover { background: var(--paper-2); }
.history-icon {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    border: 2px solid var(--ink); background: var(--paper);
}
.history-icon.in { background: var(--ink); color: var(--paper); }
.history-icon.out { background: var(--paper); color: var(--ink); }
.history-info { flex: 1; min-width: 0; }
.history-item-name {
    font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px;
}
.history-amount { font-weight: 700; font-size: 16px; }
.history-meta {
    font-size: 13px; color: var(--ink-light); margin-top: 4px;
    display: flex; align-items: center; gap: 6px; font-weight: 700;
}
.history-note {
    font-size: 12px; color: var(--ink);
    border: 1.5px solid var(--ink); background: var(--paper-2);
    padding: 2px 8px; border-radius: 8px; margin-top: 4px;
    display: inline-block; font-weight: 700;
}
.history-time { font-size: 12px; color: var(--ink-light); white-space: nowrap; flex-shrink: 0; font-weight: 700; }

.history-filters { display: flex; gap: 10px; }
#historyFilter {
    padding: 9px 14px; border: 2px solid var(--ink);
    border-radius: var(--sketch-4); font-size: 14px;
    background: var(--paper); cursor: pointer; outline: none;
    color: var(--ink); font-weight: 700; font-family: inherit;
}
#historyFilter:focus { box-shadow: 3px 3px 0 var(--ink); }

/* ===== Stats ===== */
.stats-container {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px;
}
.stat-card {
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: var(--sketch-2);
    padding: 24px; transition: all 0.2s;
}
.stat-card:nth-child(even) { border-radius: var(--sketch-3); }
.stat-card:hover { box-shadow: 5px 5px 0 var(--ink); transform: translate(-2px,-2px); }
.stat-card-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
}
.stat-big-number { font-size: 38px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
.stat-big-label { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.stat-list { display: flex; flex-direction: column; gap: 10px; }
.stat-list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px;
    border: 1.5px solid var(--ink);
    border-radius: var(--sketch-4);
    font-size: 14px; font-weight: 700;
}
.stat-list-item .label { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
.stat-list-item .value { font-weight: 700; }
.stat-list-item .badge {
    padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700;
    border: 1.5px solid var(--ink);
}
.badge.in { background: var(--ink); color: var(--paper); }
.badge.out { background: var(--paper); color: var(--ink); }

/* ===== Buttons ===== */
.btn-primary {
    background: var(--ink); color: var(--paper);
    border: 2px solid var(--ink); padding: 10px 20px;
    border-radius: var(--sketch-1); font-size: 14px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: all 0.15s; font-family: inherit;
    box-shadow: 3px 3px 0 var(--line-soft);
}
.btn-primary:hover { box-shadow: 5px 5px 0 var(--ink); transform: translate(-2px,-2px); }
.btn-primary:active { box-shadow: 1px 1px 0 var(--ink); transform: translate(1px,1px); }

.btn-secondary {
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); padding: 10px 18px;
    border-radius: var(--sketch-2); font-size: 14px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: all 0.15s; font-family: inherit;
    box-shadow: 3px 3px 0 var(--line-soft);
}
.btn-secondary:hover { box-shadow: 5px 5px 0 var(--ink); transform: translate(-2px,-2px); }

.btn-icon {
    width: 32px; height: 32px;
    border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
    cursor: pointer; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: all 0.15s; font-family: inherit;
}
.btn-icon:hover { background: var(--ink); color: var(--paper); transform: scale(1.1) rotate(90deg); }
.btn-icon.pulse {
    animation: pulse-wrench 1.2s ease-in-out infinite;
    border-color: var(--danger);
    color: var(--danger);
}
@keyframes pulse-wrench {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
}

/* ===== Modals ===== */
.modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(26,26,26,0.15);
    backdrop-filter: blur(1px);
    z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.active { display: flex; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: var(--sketch-3);
    width: 520px; max-width: 92vw; max-height: 88vh; overflow-y: auto;
    box-shadow: 8px 8px 0 var(--ink);
    animation: slideUp 0.25s ease;
}
.modal.modal-sm { width: 440px; }
@keyframes slideUp {
    from { transform: translateY(30px) rotate(-1deg); opacity: 0; }
    to { transform: translateY(0) rotate(0); opacity: 1; }
}
.modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 26px; border-bottom: 2px dashed var(--ink);
}
.modal-header h3 { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; }
.modal-close {
    width: 36px; height: 36px; border: 2px solid var(--ink); background: var(--paper);
    color: var(--ink); cursor: pointer; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    transition: all 0.15s; font-family: inherit;
}
.modal-close:hover { background: var(--ink); color: var(--paper); transform: rotate(90deg); }
.modal-body { padding: 22px 26px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 18px 26px; border-top: 2px dashed var(--ink); }

                    <p style="font-size:11px; color:var(--ink-soft); margin-top:4px;">⚠️ 这会删除本机的所有物品、地点、出入库记录。配合另一端的「强制重新同步」使用，可以让两端彻底对齐。</p>

    <script>
// ============================================
// 家庭库存管理工作台 - 核心逻辑
// ============================================

// ---- Data Layer ----
const DB_KEY = 'home_inventory_db';

// 应用版本号（用于判断浏览器是否加载到最新代码）
const APP_VERSION = '2026.08.01.27';

let db = {
    locations: [],
    items: [],
    transactions: []
};

let state = {
    selectedLocationId: 'all',    // 'all' | location id
    selectedFilter: 'all',         // 'all' | 'low'
    activeTab: 'items',
    expandedNodes: new Set(),
    searchQuery: '',
    historyFilter: 'all',
    stockType: 'in',               // 'in' | 'out'
    selectedIcon: 'fa-house'
};

// ---- Utility ----
function uid() {
    // 带类型前缀可辨，但为兼容历史数据，本地仍用随机 id。
    // 云端 collectRows 会按 id 去重，避免 location/item id 偶发冲突。
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

// 检测并修复本地数组中重复 id 的记录（保留 updatedAt 最新的一条，其余重分配 id）。
// 这是数据自救函数：一旦某条记录被意外复制成多份，后续 upsert 会因重复 PK 报错。
function repairDuplicateIds() {
    const seen = new Map(); // id -> { arr, idx, ua }
    let fixed = 0;
    function scan(arr) {
        arr.forEach((r, idx) => {
            if (!r || !r.id) return;
            const ua = r.updatedAt || 0;
            const prev = seen.get(r.id);
            if (prev) {
                // 保留较新的；旧的重分配 id
                if (ua >= prev.ua) {
                    // 当前更新，把旧的换掉
                    prev.arr[prev.idx].id = uid();
                    prev.arr[prev.idx].updatedAt = Date.now();
                    seen.set(r.id, { arr, idx, ua });
                } else {
                    r.id = uid();
                    r.updatedAt = Date.now();
                }
                fixed++;
            } else {
                seen.set(r.id, { arr, idx, ua });
            }
        });
    }
    scan(db.locations);
    scan(db.items);
    scan(db.transactions);
    if (fixed > 0) {
        console.warn('[repairDuplicateIds] 修复重复 id 记录数：', fixed);
        logSync('本地数据自检：修复 ' + fixed + ' 条重复 id');
    }
    return fixed;
}

function save(opts) {
    opts = opts || {};
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    // 自动后台同步：任何本地写入后，1.2s 内自动把改动推到云端。
    // doSync 内部的 save() 用 suppressAutoSync 包裹，避免「同步→save→又触发同步」死循环。
    if (!opts.suppressAutoSync && !suppressAutoSync) queueSync();
}

// 稳定的同步签名（用于云端 id 和跨设备匹配）。
// 关键点：签名只用「人类可读」的稳定属性（名称、位置名、分类），不用随机 id。
// 跨设备上传同一物品时签名相同 → 云端 upsert 自动合并，不需要复杂的匹配逻辑。
// 改名/移动位置后签名变化 → 创建新记录（语义上是新物品）。
// location 签名只包含名称（parent 不计入，因为位置结构是各设备自己的）。
// item 签名包含名称+位置名+分类（移动物品 = 新位置的物品）。
// transaction 签名包含 itemId+type+quantity+timestamp（确保交易记录唯一）。
function syncSignature(type, r) {
    if (type === 'location') return 'L:' + (r.name || '');
    if (type === 'item') {
        // 始终用 locNameById 当前解析，不依赖任何 locName 字段
        let loc = locNameById(r.locationId);
        // 关键修复：locNameById 返回原始 id 说明没找到位置（跨设备 id 不匹配 / 清空后 / 位置已删），
        // 此时用 locationName 字段兜底（取 "我的家 › 厨房" 的最后一段 "厨房"），
        // 否则同一物品会产生 "...|seed-cabinet|..." 和 "...|厨房|..." 两个不同签名，变成两条云端记录。
        if (loc === r.locationId && r.locationName) {
            loc = String(r.locationName).split('›').pop().trim();
        }
        if (!loc) loc = 'root';
        return 'I:' + (r.name || '') + '|' + loc + '|' + (r.category || '');
    }
    // transaction
    return 'T:' + (r.itemId || '') + '|' + (r.type || '') + '|' + (r.quantity || 0) + '|' + (r.timestamp || r.updatedAt || '');
}

// 给记录打上 _sig 标记（缓存签名），供本地同步时使用
function tagSignature(r, type) {
    if (r && !r._sig) r._sig = syncSignature(type, r);
    return r;
}

// 重新计算所有记录的 _sig（用于改名/移动后刷新签名缓存）
function retagAllSignatures() {
    db.locations.forEach(r => tagSignature(r, 'location'));
    db.items.forEach(r => tagSignature(r, 'item'));
    db.transactions.forEach(r => tagSignature(r, 'transaction'));
}

function load() {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
        try {
            db = JSON.parse(raw);
        } catch (e) {
            console.error('数据加载失败', e);
        }
    }
    // 启动时清理：locName 只是上传临时字段，不应持久化到本地。
    let cleaned = 0;
    [db.locations, db.items, db.transactions].forEach(arr => {
        arr.forEach(r => { if (r && r.hasOwnProperty('locName')) { delete r.locName; cleaned++; } });
    });
    // 启动时自检：修复可能因历史 bug 产生的重复 id
    const fixedDups = repairDuplicateIds();
    // 为所有记录打 _sig 签名标记（用于云端 id 和本地匹配）
    retagAllSignatures();
    if (cleaned > 0 || fixedDups > 0) {
        save({ suppressAutoSync: true });
    }
    // Seed demo data on first run (only when sync is NOT enabled)
    // If sync is enabled, keep local DB empty so the upcoming pull gets the
    // single source of truth from the cloud, avoiding "seed ∪ cloud" merge.
    const activeLocs = db.locations.filter(l => !l.deleted).length;
    const activeIts = db.items.filter(i => !i.deleted).length;
    if (activeLocs === 0 && activeIts === 0 && !syncEnabled()) {
        seedDemoData();
    }
}

function formatDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 7 * 86400000) return Math.floor(diff / 86400000) + '天前';
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    return `${mm}-${dd} ${hh}:${mi}`;
}

function icon(name) {
    const inner = ICONS[name] || ICONS['circle-info'];
    return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;
}

// Convert any <i class="fas fa-NAME"> in the DOM into inline SVG.
function hydrateIcons(root) {
    (root || document).querySelectorAll('i.fas').forEach(el => {
        const cls = [...el.classList].find(c => c.startsWith('fa-'));
        if (!cls) return;
        const tmp = document.createElement('span');
        tmp.innerHTML = icon(cls.slice(3));
        el.replaceWith(tmp.firstChild);
    });
}

// Auto-convert any <i class="fas ..."> added dynamically (tree expand, tab switch, search, etc.)
const _iconObserver = new MutationObserver(mutations => {
    let dirty = false;
    for (const m of mutations) {
        m.addedNodes.forEach(n => {
            if (n.nodeType !== 1) return;
            if ((n.matches && n.matches('i.fas')) || (n.querySelector && n.querySelector('i.fas'))) dirty = true;
        });
    }
    if (dirty) hydrateIcons();
});
_iconObserver.observe(document.body, { childList: true, subtree: true });

function toast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    const iconNames = { success: 'circle-check', error: 'circle-xmark', warning: 'triangle-exclamation', info: 'circle-info' };
    el.innerHTML = `${icon(iconNames[type] || 'circle-info')}<span>${message}</span>`;
    container.appendChild(el);
    setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        el.style.transition = 'all 0.3s';
        setTimeout(() => el.remove(), 300);
    }, 2500);
}

function confirmDialog(message, detail = '') {
    return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'confirm-overlay';
        overlay.innerHTML = `
            <div class="confirm-dialog">
                <div class="confirm-icon"><i class="fas fa-triangle-exclamation"></i></div>
                <h3>${message}</h3>
                ${detail ? `<p>${detail}</p>` : ''}
                <div class="confirm-actions">
                    <button class="btn-secondary" id="confirmCancel">取消</button>
                    <button class="btn-primary" id="confirmOk" style="background:var(--danger); color:var(--paper); border-color:var(--danger);">确认</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        hydrateIcons(overlay);
        overlay.querySelector('#confirmCancel').addEventListener('click', () => {
            overlay.remove();
            resolve(false);
        });
        overlay.querySelector('#confirmOk').addEventListener('click', () => {
            overlay.remove();
            resolve(true);
        });
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.remove();
                resolve(false);
            }
        });
    });
}

// ---- Location helpers ----
function getLocationById(id) {
    return db.locations.find(l => l.id === id && !l.deleted);
}

function getChildLocations(parentId) {
    if (parentId === null) {
        // 根级别：parentId 为 null 的 + 孤儿（parent 已被删除/缺失的）
        // 避免头部计数（db.locations.filter(!deleted)）和树形菜单显示不一致。
        const activeParentIds = new Set(db.locations.filter(l => !l.deleted).map(l => l.id));
        return db.locations.filter(l =>
            !l.deleted && (l.parentId === null || !activeParentIds.has(l.parentId))
        );
    }
    return db.locations.filter(l => l.parentId === parentId && !l.deleted);
}

function getLocationPath(id) {
    const path = [];
    let loc = getLocationById(id);
    while (loc) {
        path.unshift(loc);
        loc = getLocationById(loc.parentId);
    }
    return path;
}

function getLocationPathString(id) {
    const path = getLocationPath(id);
    return path.map(l => l.name).join(' › ');
}

function getDescendantLocationIds(id) {
    const result = [id];
    const children = getChildLocations(id);
    for (const child of children) {
        result.push(...getDescendantLocationIds(child.id));
    }
    return result;
}

// 不过滤已删除的遍历（用于删除时标记墓碑，确保子节点一并处理）
function rawDescendants(id) {
    const result = [id];
    const stack = [id];
    while (stack.length) {
        const cur = stack.pop();
        db.locations.forEach(l => {
            if (l.parentId === cur) { result.push(l.id); stack.push(l.id); }
        });
    }
    return result;
}

function countItemsInLocation(locId) {
    const ids = getDescendantLocationIds(locId);
    return db.items.filter(i => !i.deleted && ids.includes(i.locationId)).length;
}

// 返回所有「有效」地点 id 集合（未删除的地点）
function getValidLocationIdSet() {
    return new Set(db.locations.filter(l => !l.deleted).map(l => l.id));
}

// 孤儿物品：存在（未删除）但所指向的地点已不存在/被删除
function getOrphanItems() {
    const valid = getValidLocationIdSet();
    return db.items.filter(i => !i.deleted && !valid.has(i.locationId));
}

// 游离地点：自身有效，但 parentId 指向一个不存在的地点（同步历史遗留）
function getFloatingLocations() {
    const valid = getValidLocationIdSet();
    return db.locations.filter(l => !l.deleted && l.parentId && !valid.has(l.parentId));
}

// 一键修复游离地点：把它们挂到第一个根地点（通常是「我的家」）下面
function repairFloatingLocations() {
    const roots = getChildLocations(null);
    if (roots.length === 0) {
        toast('没有根地点，请先添加一个地点', 'warning');
        return;
    }
    const targetId = roots[0].id;
    const floating = getFloatingLocations();
    if (floating.length === 0) {
        toast('没有需要修复的游离地点', 'info');
        return;
    }

    const now = Date.now();
    let fixedCount = 0;
    for (const loc of floating) {
        // 避免循环：如果目标地点本身就是该地点的后代，则跳过
        if (getDescendantLocationIds(loc.id).includes(targetId)) continue;
        loc.parentId = targetId;
        loc.updatedAt = now;
        fixedCount++;
    }

    if (fixedCount === 0) {
        toast('没有可修复的游离地点', 'info');
        return;
    }

    // 把这些地点都展开，方便用户看到修复结果
    for (const loc of floating) {
        state.expandedNodes.add(loc.id);
        let p = getLocationById(loc.parentId);
        while (p) {
            state.expandedNodes.add(p.id);
            p = getLocationById(p.parentId);
        }
    }

    save();
    renderLocationTree();
    renderAll();
    toast(`已修复 ${fixedCount} 个游离地点，挂回到「${roots[0].name}」下`, 'success');
}

// ---- Item helpers ----
function getItemById(id) {
    return db.items.find(i => i.id === id && !i.deleted);
}

function getFilteredItems() {
    let items = db.items.filter(i => !i.deleted);

    // Location filter
    if (state.selectedLocationId === 'orphan') {
        items = getOrphanItems();
    } else if (state.selectedLocationId !== 'all') {
        const locIds = getDescendantLocationIds(state.selectedLocationId);
        items = items.filter(i => locIds.includes(i.locationId));
    }

    // Low stock filter
    if (state.selectedFilter === 'low') {
        items = items.filter(i => i.minStock > 0 && i.quantity <= i.minStock);
    }

    // Search filter
    if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        items = items.filter(i =>
            i.name.toLowerCase().includes(q) ||
            (i.category && i.category.toLowerCase().includes(q)) ||
            getLocationPathString(i.locationId).toLowerCase().includes(q)
        );
    }

    return items;
}

// ---- Render: Location Tree ----
function renderLocationTree() {
    const container = document.getElementById('locationTree');
    const roots = getChildLocations(null);

    if (roots.length === 0) {
        container.innerHTML = `
            <div class="empty-state" style="padding: 30px 10px;">
                ${mascotSVG(60, '#88b8d8')}
                <h3>还没有地点哦</h3>
                <p>点击右上角 + 添加你的第一个地点</p>
            </div>
        `;
        return;
    }

    let html = '';

    // "All items" option
    html += `
        <div class="tree-node">
            <div class="tree-node-content ${state.selectedLocationId === 'all' ? 'active' : ''}" data-loc-id="all">
                <div class="tree-toggle empty"></div>
                <div class="tree-icon"><i class="fas fa-list"></i></div>
                <div class="tree-label">全部物品</div>
                <div class="tree-count">${db.items.filter(i => !i.deleted).length}</div>
            </div>
        </div>
    `;

    for (const root of roots) {
        html += renderTreeNode(root);
    }

    // 游离地点：自身有效，但父节点已不存在（同步历史遗留），把它们挂到侧栏根下
    const floating = getFloatingLocations();
    for (const loc of floating) {
        html += renderTreeNode(loc, true);
    }

    // 「未分类」节点：位置孤儿物品（所指向地点已不存在）
    const orphanCount = getOrphanItems().length;
    if (orphanCount > 0) {
        html += `
            <div class="tree-node">
                <div class="tree-node-content orphan-node ${state.selectedLocationId === 'orphan' ? 'active' : ''}" data-loc-id="orphan">
                    <div class="tree-toggle empty"></div>
                    <div class="tree-icon"><i class="fas fa-question-circle"></i></div>
                    <div class="tree-label">未分类</div>
                    <div class="tree-count">${orphanCount}</div>
                </div>
            </div>
        `;
    }

    container.innerHTML = html;
    bindTreeEvents();

    // 有游离地点时，高亮修复按钮提醒用户
    const repairBtn = document.getElementById('repairLocationsBtn');
    if (repairBtn) {
        repairBtn.classList.toggle('pulse', getFloatingLocations().length > 0);
        repairBtn.title = getFloatingLocations().length > 0
            ? `检测到 ${getFloatingLocations().length} 个游离地点，点击修复`
            : '修复游离地点';
    }
}

function renderTreeNode(loc, isFloating = false) {
    const children = getChildLocations(loc.id);
    const hasChildren = children.length > 0;
    const isExpanded = state.expandedNodes.has(loc.id);
    const count = countItemsInLocation(loc.id);
    const isActive = state.selectedLocationId === loc.id;
    const floatingClass = isFloating ? 'floating-node' : '';
    const floatingHint = isFloating ? ' (父节点已缺失)' : '';

    let html = `
        <div class="tree-node">
            <div class="tree-node-content ${floatingClass} ${isActive ? 'active' : ''}" data-loc-id="${loc.id}">
                <div class="tree-toggle ${hasChildren ? '' : 'empty'} ${isExpanded ? 'expanded' : ''}">
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="tree-icon"><i class="fas ${loc.icon || 'fa-location-dot'}"></i></div>
                <div class="tree-label">${loc.name}${floatingHint}</div>
                <div class="tree-count">${count}</div>
                <div class="tree-actions">
                    <button class="tree-action-btn add-child" data-loc-id="${loc.id}" title="添加子位置">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="tree-action-btn edit" data-loc-id="${loc.id}" title="编辑">
                        <i class="fas fa-pen"></i>
                    </button>
                    <button class="tree-action-btn delete" data-loc-id="${loc.id}" title="删除">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
    `;

    if (hasChildren) {
        html += `<div class="tree-children ${isExpanded ? 'expanded' : ''}">`;
        for (const child of children) {
            html += renderTreeNode(child);
        }
        html += `</div>`;
    }

    html += `</div>`;
    return html;
}

function bindTreeEvents() {
    // Click node content (select location)
    document.querySelectorAll('.tree-node-content').forEach(el => {
        el.addEventListener('click', (e) => {
            if (e.target.closest('.tree-actions') || e.target.closest('.tree-toggle')) return;
            const locId = el.dataset.locId;
            selectLocation(locId);
        });

        // Toggle expand on arrow click
        const toggle = el.querySelector('.tree-toggle');
        if (toggle && !toggle.classList.contains('empty')) {
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const locId = el.dataset.locId;
                if (state.expandedNodes.has(locId)) {
                    state.expandedNodes.delete(locId);
                } else {
                    state.expandedNodes.add(locId);
                }
                renderLocationTree();
            });
        }
    });

    // Action buttons
    document.querySelectorAll('.tree-action-btn.add-child').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openLocationModal(null, btn.dataset.locId);
        });
    });

    document.querySelectorAll('.tree-action-btn.edit').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openLocationModal(btn.dataset.locId, null);
        });
    });

    document.querySelectorAll('.tree-action-btn.delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const locId = btn.dataset.locId;
            await deleteLocation(locId);
        });
    });
}

            </div>
            <div class="item-quantity">

async function saveLocation() {
    const name = document.getElementById('locationName').value.trim();
    const editId = document.getElementById('locationEditId').value;
    const parentId = document.getElementById('locationParentId').value || null;
    const icon = state.selectedIcon;

    if (!name) {
        toast('请输入地点名称', 'error');
        return;
    }

    if (editId) {
        const loc = getLocationById(editId);
        if (loc) {
            loc.name = name;
            loc.icon = icon;
            loc._sig = syncSignature('location', loc);  // 改名后刷新签名
        }
        toast('地点已更新', 'success');
    } else {
        const newLoc = { id: uid(), name, parentId, icon };
        tagSignature(newLoc, 'location');
        db.locations.push(newLoc);
        if (parentId) {
            state.expandedNodes.add(parentId);
            // Also expand all ancestors
            let p = getLocationById(parentId);
            while (p) {
                state.expandedNodes.add(p.id);
                p = getLocationById(p.parentId);
            }
        }
        toast('地点已添加', 'success');
    }

    save();
    closeModal('locationModal');
    renderAll();
    queueSync();
}

async function deleteLocation(locId) {
    const loc = getLocationById(locId);
    if (!loc) return;

    const descendants = getDescendantLocationIds(locId);
    const itemCount = db.items.filter(i => descendants.includes(i.locationId)).length;
    const locCount = descendants.length;

    const detail = `将删除「${loc.name}」${locCount > 1 ? `及其 ${locCount - 1} 个子位置` : ''}${itemCount > 0 ? `，以及其中 ${itemCount} 个物品` : ''}。此操作不可撤销。`;

    const confirmed = await confirmDialog(`确认删除「${loc.name}」?`, detail);
    if (!confirmed) return;

    // 标记为删除（墓碑），同步后在各端生效；本地会在成功上传后清理
    const ts = Date.now();
    db.locations.forEach(l => { if (descendants.includes(l.id)) { l.deleted = true; l.updatedAt = ts; } });
    db.items.forEach(i => { if (descendants.includes(i.locationId)) { i.deleted = true; i.updatedAt = ts; } });
    db.transactions.forEach(t => { if (descendants.includes(t.locationId)) { t.deleted = true; t.updatedAt = ts; } });

    if (state.selectedLocationId !== 'all' && descendants.includes(state.selectedLocationId)) {
        state.selectedLocationId = 'all';
    }

    save();
    toast('地点已删除', 'success');
    renderAll();
    queueSync();
}

function saveItem() {
    const name = document.getElementById('itemName').value.trim();
    const quantity = parseInt(document.getElementById('itemQuantity').value) || 0;
    const unit = document.getElementById('itemUnit').value.trim() || '个';
    const locationId = document.getElementById('itemLocation').value;
    const category = document.getElementById('itemCategory').value.trim();
    const minStock = parseInt(document.getElementById('itemMinStock').value) || 0;
    const notes = document.getElementById('itemNotes').value.trim();
    const barcode = document.getElementById('itemBarcode').value.trim();
    const editId = document.getElementById('itemEditId').value;

    if (!name) {
        toast('请输入物品名称', 'error');
        return;
    }

    const now = Date.now();

    if (editId) {
        const item = getItemById(editId);
        if (item) {
            const oldQty = item.quantity;
            item.name = name;
            item.quantity = quantity;
            item.unit = unit;
            item.locationId = locationId;
            item.category = category;
            item.minStock = minStock;
            item.notes = notes;
            item.barcode = barcode;
            item.updatedAt = now;
            item._sig = syncSignature('item', item);  // 改名/移动后刷新签名

            // If quantity changed, create a transaction
            if (oldQty !== quantity) {
                const diff = quantity - oldQty;
                const txn = {
                    id: uid(),
                    itemId: item.id,
                    itemName: name,
                    locationId: locationId,
                    locationName: getLocationPathString(locationId),
                    type: diff > 0 ? 'in' : 'out',
                    quantity: Math.abs(diff),
                    unit: unit,
                    note: '编辑调整',
                    timestamp: now
                };
                tagSignature(txn, 'transaction');
                db.transactions.push(txn);
            }

            toast('物品已更新', 'success');
        }
    } else {
        const newItem = {
            id: uid(),
            name,
            quantity,
            unit,
            locationId,
            category,
            minStock,
            notes,
            barcode,
            createdAt: now,
            updatedAt: now
        };
        tagSignature(newItem, 'item');
        db.items.push(newItem);

        // If initial quantity > 0, create an "in" transaction
        if (quantity > 0) {
            const txn = {
                id: uid(),
                itemId: newItem.id,
                itemName: name,
                locationId,
                locationName: getLocationPathString(locationId),
                type: 'in',
                quantity,
                unit,
                note: '初始入库',
                timestamp: now
            };
            tagSignature(txn, 'transaction');
            db.transactions.push(txn);
        }

        toast('物品已添加', 'success');
    }

    save();
    closeModal('itemModal');
    renderAll();
    queueSync();
}

async function deleteItem(itemId) {
    const item = getItemById(itemId);
    if (!item) return;

    const confirmed = await confirmDialog(`确认删除「${item.name}」?`, '该物品的出入库记录也会一并删除，此操作不可撤销。');
    if (!confirmed) return;

    const ts = Date.now();
    item.deleted = true;
    item.updatedAt = ts;
    db.transactions.forEach(t => { if (t.itemId === itemId) { t.deleted = true; t.updatedAt = ts; } });

    save();
    toast('物品已删除', 'success');
    renderAll();
    queueSync();
}

        <div style="font-size:12px;color:var(--text-light);margin-top:4px;">
            <i class="fas fa-location-dot"></i> ${getLocationPathString(item.locationId)}
        </div>
    `;

    amountInput.value = 1;

    amountInput.max = type === 'out' ? item.quantity : '';

    document.querySelectorAll('.stock-type-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === type);
    });

    // Update quick buttons visibility
    document.querySelectorAll('.stock-quick-btn').forEach(btn => {
        const amt = parseInt(btn.dataset.amount);
        if (type === 'out' && amt > item.quantity) {
            btn.disabled = true;
            btn.style.opacity = '0.4';

            btn.style.opacity = '1';

function confirmStock() {
    const itemId = document.getElementById('stockItemId').value || document.querySelector('.stock-btn.active')?.dataset.itemId;
    // Actually we need to store the item ID somewhere when opening
    // Let me fix this - store it in a state variable
    const item = state.stockItem;
    if (!item) return;

    const amount = parseInt(document.getElementById('stockAmount').value) || 0;
    const note = document.getElementById('stockNote').value.trim();
    const type = state.stockType;

    if (amount <= 0) {
        toast('请输入有效数量', 'error');
        return;
    }

    if (type === 'out' && amount > item.quantity) {
        toast(`库存不足，当前仅剩 ${item.quantity} ${item.unit}`, 'error');
        return;
    }

    // Update item
    if (type === 'in') {
        item.quantity += amount;
    } else {
        item.quantity -= amount;
    }
    item.updatedAt = Date.now();

    // Create transaction
    const txn = {
        id: uid(),
        itemId: item.id,
        itemName: item.name,
        locationId: item.locationId,
        locationName: getLocationPathString(item.locationId),
        type,
        quantity: amount,
        unit: item.unit,
        note: note || (type === 'in' ? '入库' : '出库'),
        timestamp: Date.now()
    };
    tagSignature(txn, 'transaction');
    db.transactions.push(txn);

    save();
    closeModal('stockModal');
    state.stockItem = null;

    // Check low stock
    if (item.minStock > 0 && item.quantity <= item.minStock) {
        toast(`${item.name} 库存偏低，仅剩 ${item.quantity} ${item.unit}`, 'warning');
    } else {
        toast(`${type === 'in' ? '入库' : '出库'}成功: ${item.name} ${type === 'in' ? '+' : '-'}${amount} ${item.unit}`, 'success');
    }

    renderAll();
    queueSync();
}

function loadSyncConfig() {

    if (!syncConfig || typeof syncConfig !== 'object') {
        // 首次打开（无本地配置）：使用内置默认，自动启用同步
        syncConfig = JSON.parse(JSON.stringify(BUILTIN_SYNC));
        corrected = true;
    } else if (!syncConfig.url || !syncConfig.anonKey) {
        // 本地存有早期空白模板遗留的配置（缺凭据）：用内置默认覆盖并启用
        syncConfig.url = BUILTIN_SYNC.url;
        syncConfig.anonKey = BUILTIN_SYNC.anonKey;
        syncConfig.enabled = true;
        corrected = true;
    }
    if (typeof syncConfig.lastSync !== 'number') syncConfig.lastSync = 0;
    if (corrected) {
        try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncConfig)); } catch (e) {}
    }
}

function saveSyncConfig() {
    localStorage.setItem(SYNC_KEY, JSON.stringify(syncConfig));
}

function syncAvailable() {
    return typeof window.supabase !== 'undefined';
}

function syncEnabled() {
    return !!(syncConfig && syncConfig.enabled && supabaseClient);
}

function initSupabase() {
    if (!syncConfig || !syncConfig.url || !syncConfig.anonKey) return false;
    if (!syncAvailable()) return false;
    try {
        // 所有 Supabase 请求禁用浏览器缓存，避免手机浏览器/代理缓存返回旧数据
        const noStoreFetch = (input, init) => {
            init = init || {};
            init.cache = 'no-store';
            return fetch(input, init);
        };
        supabaseClient = window.supabase.createClient(syncConfig.url, syncConfig.anonKey, {
            auth: { persistSession: false },
            global: { fetch: noStoreFetch }
        });
        return true;
    } catch (e) {
        console.error('Supabase 初始化失败', e);
        supabaseClient = null;
        return false;
    }
}

function setSyncStatus(stateName, msg) {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    const map = { ok: '已同步', syncing: '同步中…', error: '同步失败', off: '未启用' };
    const dot = el.querySelector('.sync-dot');
    const txt = el.querySelector('.sync-text');
    if (dot) dot.className = 'sync-dot ' + stateName;
    if (txt) txt.textContent = msg || map[stateName] || '';
}

// 打包本地所有记录为待上传行（含墓碑）。
// 云端 id 用「签名」（稳定的人类可读属性），跨设备上传同一物品时 upsert 自动合并。
function collectRows() {
    const now = Date.now();
    const seen = new Map(); // 签名 -> row
    const walk = (arr, type) => arr.forEach(r => {
        if (!r) return;
        let ua = r.updatedAt || 0;
        if (!ua) { ua = now; r.updatedAt = ua; }
        // 计算签名（人类可读的稳定属性）
        const sig = syncSignature(type, r);
        // 同一个签名只保留 updated_at 最大的那条
        const existing = seen.get(sig);
        if (existing && existing.updated_at >= ua) return;
        // data 是 r 的副本，避免污染本地对象
        const data = Object.assign({}, r);
        delete data._sig;  // _sig 只是本地缓存标记，不上传
        seen.set(sig, { id: sig, type, data, updated_at: ua });
    });
    walk(db.locations, 'location');
    walk(db.items, 'item');
    walk(db.transactions, 'transaction');
    return Array.from(seen.values());
}

async function pushToRemote() {
    const rows = collectRows();
    if (rows.length === 0) { logSync('本地无数据可推送'); return; }
    logSync('推送 ' + rows.length + ' 条记录…');

    // 优先走 API 代理；404 时回退直连 Supabase
    if (!_directMode) {
        try {
            const url = '/api/sync-push?_=' + Date.now();
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(rows),
                cache: 'no-store'
            });
            if (resp.ok) {
                logSync('推送完成（' + rows.length + ' 条）');
                return;
            } else if (resp.status === 404) {
                _directMode = true;
                logSync('API 推送代理不可用（404），切换直连 Supabase');
            } else {
                const txt = await resp.text().catch(() => '');
                if (txt.includes('cannot affect row a second time')) {
                    logSync('推送失败：存在重复 id，已自动修复，请重试');
                } else {
                    logSync('推送失败：HTTP ' + resp.status + ' ' + txt.slice(0, 120));
                }
                throw new Error('推送失败：HTTP ' + resp.status);
            }
        } catch (e) {
            if (e.message && e.message.includes('推送失败')) throw e;
            _directMode = true;
            logSync('API 推送代理异常，切换直连 Supabase');
        }
    }

    // 回退：直连 Supabase REST upsert
    const baseUrl = syncConfig.url.replace(/\/$/, '');
    const resp = await fetch(baseUrl + '/rest/v1/goods_records', {
        method: 'POST',
        headers: {
            'apikey': syncConfig.anonKey,
            'Authorization': 'Bearer ' + syncConfig.anonKey,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates',
            'Cache-Control': 'no-store'
        },
        body: JSON.stringify(rows),
        cache: 'no-store'
    });
    if (!resp.ok && resp.status !== 201 && resp.status !== 204) {
        const txt = await resp.text().catch(() => '');
        logSync('直连推送失败：HTTP ' + resp.status + ' ' + txt.slice(0, 120));
        throw new Error('推送失败：HTTP ' + resp.status);
    }
    logSync('推送完成（' + rows.length + ' 条，直连）');
}

// 解析地点 id 为名称（用于跨设备按「位置名称」而非随机 id 匹配）
function locNameById(id) {
    // 允许查找已删除（墓碑）地点，因为墓碑物品仍需要可读的位置名来做跨设备签名匹配。
    const l = db.locations.find(x => x.id === id);
    return l ? l.name : (id || 'root');
}

// 记录指纹：用于跨设备识别「同一物品/地点」。
// 关键：物品用「名称 + 位置名称 + 分类」而非 locationId，因为各端地点是随机 id，
// 但位置名称是一致的（如「厨房」「客厅」）。这样即使 id 不同也能正确合并。
//
// preferLocName=true 用于云端传入记录：其 locationId 是对方设备的，本地解析不到，
// 因此优先使用云端携带的 locName。
// preferLocName=false 用于本地记录：必须基于本地当前实际 locationId 解析位置名，
// 绝不能使用可能过时的 locName 字段，否则两端签名会错位。
function recordSignature(type, r, preferLocName) {
    // 兼容旧调用，现在直接调 syncSignature
    return syncSignature(type, r);
}

let syncLogLines = [];
function logSync(msg) {
    const t = fmtClock();
    syncLogLines.push('[' + t + '] ' + msg);
    if (syncLogLines.length > 200) syncLogLines = syncLogLines.slice(-200);
    const box = document.getElementById('syncLog');
    if (box) { box.textContent = syncLogLines.join('\n'); box.scrollTop = box.scrollHeight; }
}

// 把云端记录的字段合并进本地记录。
// 云端 id 是签名（已通过 mergeRecord 的签名匹配找到本地对应记录）。
// 保留本地随机 id（跨设备不同），但合并其他字段。
function mergeFields(local, inc) {
    const keepId = local.id;
    const keepLoc = local.locationId;
    const keepParent = local.parentId;
    Object.assign(local, inc);
    local.id = keepId;
    local.parentId = keepParent;
    delete local.locName;
    delete local._sig;  // _sig 是本地缓存的签名，不要被覆盖（mergeRecord 之后会重新设置）
    // locationId：尝试按云端位置名在本地找同名地点
    if (inc.hasOwnProperty('locationId')) {
        // 云端 locationId 是对方设备的 id，本地无法直接对应
        // 简单做法：保留本地 locationId（因为我们之前已经通过签名匹配到这里了）
        local.locationId = keepLoc;
    } else {
        local.locationId = keepLoc;
    }
}

// 合并云端记录到本地。
// 云端 id 已是签名（人类可读属性），直接按签名匹配本地。
// 跨设备同一物品 → 签名相同 → 找到本地对应记录 → 合并字段（保留本地随机 id）。
function mergeRecord(row) {
    const arr = row.type === 'location' ? db.locations
              : row.type === 'item' ? db.items
              : db.transactions;
    const inc = row.data || {};
    const incUa = inc.updatedAt || 0;
    const sig = row.id;  // 云端 id 就是签名

    // 1) 按签名（云端 id）匹配本地
    const dupIdx = arr.findIndex(r => r._sig === sig);
    if (dupIdx !== -1) {
        const local = arr[dupIdx];
        const localUa = local.updatedAt || 0;
        if (incUa >= localUa) {
            if (inc.deleted) {
                if (!local.deleted) {
                    local.deleted = true;
                    local.updatedAt = incUa;
                    pendingPushAfterPull = true;
                    logSync('← 删除（签名）：「' + (inc.name || sig) + '」');
                }
            } else {
                const before = JSON.stringify(local);
                mergeFields(local, inc);
                local.updatedAt = incUa;
                local._sig = sig;  // 签名就是云端 id
                if (JSON.stringify(local) !== before) {
                    pendingPushAfterPull = true;
                    logSync('← 更新（签名）：「' + (inc.name || sig) + '」 qty=' + (inc.quantity !== undefined ? inc.quantity : ''));
                }
            }
        }
        return;
    }

    // 2) 本地无对应记录
    if (inc.deleted) { logSync('← 跳过墓碑（本地无对应）：' + (inc.name || sig)); return; }
    // 新物品来自云端：尽量把其 locationId 对应到本地同名地点
    if (row.type === 'item' && inc.locationId) {
        const loc = db.locations.find(l => !l.deleted && (l.id === inc.locationId || l._sig === ('L:' + inc.locationId)));
        // 注：inc.locationId 可能是对方设备的随机 id，这里只能模糊匹配
    }
    // 给新记录打 _sig
    inc._sig = sig;
    arr.push(inc);
    pendingPushAfterPull = true;
    logSync('← 新增（云端）：「' + (inc.name || sig) + '」');
}

async function pullFromRemote() {
    // 优先走同源 API 函数 /api/sync-pull（Vercel/Cloudflare 等支持 serverless 的平台）。
    // GitHub Pages 等不支持 serverless 的平台会 404 → 自动回退直连 Supabase + no-store + 重试。
    let data = [];
    let total = null;

    if (!_directMode) {
        // 尝试 API 代理
        try {
            const apiUrl = '/api/sync-pull?_=' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
            const r = await fetch(apiUrl, { method: 'GET', cache: 'no-store' });
            if (r.ok) {
                const j = await r.json();
                total = (typeof j.total === 'number') ? j.total : null;
                data = Array.isArray(j.rows) ? j.rows : [];
                // 长度校验 + 重试
                let lastLen = -1;
                for (let attempt = 1; attempt <= 5; attempt++) {
                    if (attempt > 1) {
                        if (total !== null && data.length >= total) break;
                        if (total === null && data.length === lastLen) break;
                    }
                    lastLen = data.length;
                    if (attempt < 5 && total !== null && data.length < total) {
                        logSync('拉取到 ' + data.length + ' 条（云端共 ' + total + ' 条），1.5秒后确认(' + attempt + '/5)');
                        await new Promise(rr => setTimeout(rr, 1500));
                        const r2 = await fetch('/api/sync-pull?_=' + Date.now() + '_' + Math.random().toString(36).slice(2, 10), { cache: 'no-store' });
                        if (r2.ok) { const j2 = await r2.json(); data = Array.isArray(j2.rows) ? j2.rows : []; total = j2.total ?? total; }
                    }
                }
                // 合并
                if (data && data.length) {
                    for (const row of data) mergeRecord(row);
                    logSync('拉取 ' + data.length + ' 条云端记录' + (pendingPushAfterPull ? '（有更新需推送）' : '（无变化）'));
                } else {
                    logSync('拉取 0 条（云端为空）');
                }
                syncConfig.lastSync = Date.now();
                saveSyncConfig();
                return;
            } else if (r.status === 404) {
                _directMode = true;
                logSync('API 代理不可用（404），切换直连 Supabase');
            } else {
                logSync('API 代理异常：HTTP ' + r.status + '，切换直连 Supabase');
                _directMode = true;
            }
        } catch (e) {
            _directMode = true;
            logSync('API 代理不可用，切换直连 Supabase');
        }
    }

    // 回退：直连 Supabase，用 RPC POST 请求拉取（POST 不被任何 HTTP 缓存机制缓存）
    const baseUrl = syncConfig.url.replace(/\/$/, '');
    const headers = {
        'apikey': syncConfig.anonKey,
        'Authorization': 'Bearer ' + syncConfig.anonKey,
        'Content-Type': 'application/json',
        'Cache-Control': 'no-store'
    };

    let lastLen = -1;
    for (let attempt = 1; attempt <= 3; attempt++) {
        // POST 到 RPC 函数 get_all_records，绕开 GET 缓存
        const r = await fetch(baseUrl + '/rest/v1/rpc/get_all_records', {
            method: 'POST',
            headers,
            body: '{}',
            cache: 'no-store'
        });
        if (!r.ok) {
            logSync('直连拉取失败：HTTP ' + r.status);
            if (attempt < 3) await new Promise(rr => setTimeout(rr, 1500));
            continue;
        }
        const result = await r.json();
        data = Array.isArray(result) ? result : [];
        total = data.length; // RPC 返回全部记录，total = data.length

        if (attempt > 1 && data.length === lastLen) break;
        lastLen = data.length;
        if (attempt < 3) {
            logSync('拉取到 ' + data.length + ' 条，确认(' + attempt + '/3)');
            await new Promise(r => setTimeout(r, 1000));
        }
    }

    if (data && data.length) {
        for (const row of data) mergeRecord(row);
        logSync('拉取 ' + data.length + ' 条云端记录' + (pendingPushAfterPull ? '（有更新需推送）' : '（无变化）'));
    } else {
        logSync('拉取 0 条（云端为空）');
    }
    syncConfig.lastSync = Date.now();
    saveSyncConfig();
}

function fmtClock(ts) {
    const d = ts ? new Date(ts) : new Date();
    const p = n => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

let syncInProgress = false;
let suppressAutoSync = false;
let pendingPushAfterPull = false;
let _directMode = false; // API 代理不可用时（如 GitHub Pages）自动切直连 Supabase

// 核心改变：先拉取后推送。
// 旧版「先 push 后 pull」有致命缺陷：B 在拉取 A 的更新之前，先把自己
// 过时的数据推上去，若两记录 id 已对齐，会把云端 A 的新数据覆盖掉。
// 改为先 pull：B 先收到 A 的更新、合并到本地，再 push 最新结果。
// 如果 pull 改了本地数据，设 pendingPushAfterPull=true，push 阶段会把
// 合并结果上传，让其他设备也能看到。
async function doSync(pullOnly) {
    if (!syncEnabled() || syncInProgress) return;
    syncInProgress = true;
    setSyncStatus('syncing');
    try {
        logSync('── 开始同步' + (pullOnly ? '（仅拉取）' : '') + ' ──');
        pendingPushAfterPull = false;
        // 1) 先拉取：把云端最新数据合并到本地
        await pullFromRemote();
        // 2) 仅在非 pullOnly 时推送。
        //    页面加载/切回前台时只拉不推，避免把本地陈旧/脏数据推回云端覆盖干净数据。
        //    用户点「立即同步」或 save 触发的同步才做完整 pull+push。
        if (!pullOnly) {
            await pushToRemote();
        }
        // 3) 保存并刷新
        suppressAutoSync = true;
        save();
        suppressAutoSync = false;
        renderAll();
        syncConfig.lastSync = Date.now();
        saveSyncConfig();
        setSyncStatus('ok', '已同步 · ' + fmtClock());
        logSync('── 同步完成 ──');
    } catch (e) {
        console.error('同步出错', e);
        logSync('同步出错：' + ((e && e.message) ? e.message : e));
        setSyncStatus('error', (e && e.message) ? e.message : '同步出错');
    } finally {
        syncInProgress = false;
        pendingPushAfterPull = false;
    }
}

function queueSync() {
    if (!syncEnabled()) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { doSync(); }, 1200);
}

// ---- 同步设置弹窗 ----
function openSyncModal() {
    document.getElementById('syncUrl').value = syncConfig.url || '';
    document.getElementById('syncKey').value = syncConfig.anonKey || '';
    const st = document.getElementById('syncStatusModal');
    if (st) {
        if (syncEnabled()) st.innerHTML = '<span class="sync-dot ok"></span><span>已连接，可点「立即同步」</span>';
        else st.innerHTML = '<span class="sync-dot off"></span><span>尚未启用</span>';
    }
    document.getElementById('syncModal').classList.add('active');
}

async function enableSync() {
    const url = document.getElementById('syncUrl').value.trim();
    const key = document.getElementById('syncKey').value.trim();
    if (!url || !key) { toast('请填写 Project URL 和 anon key', 'error'); return; }
    syncConfig.url = url;
    syncConfig.anonKey = key;
    syncConfig.enabled = true;
    saveSyncConfig();
    if (!initSupabase()) {
        syncConfig.enabled = false;
        saveSyncConfig();
        toast('Supabase 库未加载（请检查网络后重试）', 'error');
        return;
    }
    document.getElementById('syncModal').classList.remove('active');
    toast('正在同步…', 'info');
    await doSync();
    if (syncEnabled()) {
        toast('云同步已启用', 'success');
        setSyncStatus('ok');
    }
}

async function manualSync() {
    if (!syncEnabled()) { toast('请先在「云同步」里启用同步', 'warning'); return; }
    await doSync();
    toast('已同步', 'success');
}

// 清空本机所有数据：物品、地点、出入库记录全部删除，重新初始化为种子数据。
// 用途：当两端数据已经严重分裂、无法靠普通 sync 修复时，在「数据不完整」的一端
// 执行「清空本地」+「立即同步」，另一端执行「强制重新同步」，即可让两端彻底对齐。
async function resetLocalData() {
    const confirmed = await confirmDialog(
        '确认清空本机所有数据？',
        '这会删除本机的所有物品、地点、出入库记录。若已启用同步，清空后本端为空白，配合另一端的「强制重新同步」使用，可让两端数据彻底对齐。此操作不可撤销！'
    );
    if (!confirmed) return;
    logSync('清空本机数据…');
    db = { locations: [], items: [], transactions: [] };
    // 已启用同步时不再 seed：清空后保持空白，等用户点「立即同步」从云端拉取完整数据，
    // 避免种子数据被合并/推送回云端，造成「种子 ∪ 云端」污染。
    const syncing = syncEnabled() && syncConfig.url && syncConfig.anonKey;
    if (!syncing) {
        seedDemoData();  // 仅在未启用同步时恢复示例数据
        logSync('本机已重置为种子数据，共 ' + (db.locations.length + db.items.length + db.transactions.length) + ' 条');
        toast('本机数据已清空并恢复示例数据', 'info');
    } else {
        logSync('本机数据已清空（空白），请点「立即同步」拉取云端数据');
        toast('本机已清空，请点「立即同步」拉取云端', 'info');
    }
    retagAllSignatures();
    suppressAutoSync = true;
    save();
    suppressAutoSync = false;
    renderAll();
}

// 清理本地的墓碑（deleted=true 的记录）。
// 用途：电脑本地累积了大量墓碑时，先清理墓碑再 push，避免云端被墓碑污染。
// 注意：清理完墓碑后，必须立即 push 一次（forceSync），否则其他设备的删除操作会丢失。
async function purgeLocalTombstones() {
    const confirmed = await confirmDialog(
        '清理本地的墓碑记录？',
        '这会删除本机所有 deleted=true 的墓碑（删除标记）。如果你打算在另一端执行「强制重新同步」清空云端并以本机活记录为准，建议先点此清理，避免墓碑污染云端。'
    );
    if (!confirmed) return;
    const before = db.locations.length + db.items.length + db.transactions.length;
    db.locations = db.locations.filter(r => !r.deleted);
    db.items = db.items.filter(r => !r.deleted);
    db.transactions = db.transactions.filter(r => !r.deleted);
    retagAllSignatures();
    const after = db.locations.length + db.items.length + db.transactions.length;
    const removed = before - after;
    logSync('清理本地墓碑：移除 ' + removed + ' 条，保留 ' + after + ' 条活记录');
    save({ suppressAutoSync: true });
    renderAll();
    toast('已清理 ' + removed + ' 条墓碑', 'success');
}

// 强制重新同步：以本机为准覆盖云端。
// 历史旧版本 bug 会物理删除本地墓碑，造成两端数据分裂：一端有墓碑，另一端完全缺失该记录，
// 普通合并无法让缺失端再「删除一次」。此时需要先清空云端，再由数据较完整的一端重新上传，
// 另一端随后点「立即同步」拉取并对齐。
async function forceSync() {
    if (!syncEnabled()) { toast('请先在「云同步」里启用同步', 'warning'); return; }
    const confirmed = await confirmDialog(
        '确认以本机为准覆盖云端？',
        '这会先清空 Supabase 里的云端记录，再把本机完整数据上传（自动清理墓碑）。另一台设备随后点「立即同步」会以本机数据为准对齐。此操作不可撤销。'
    );
    if (!confirmed) return;

    if (syncInProgress) return;
    syncInProgress = true;
    setSyncStatus('syncing');
    try {
        // 先清理本地墓碑，避免墓碑污染云端
        const beforeCount = db.locations.length + db.items.length + db.transactions.length;
        db.locations = db.locations.filter(r => !r.deleted);
        db.items = db.items.filter(r => !r.deleted);
        db.transactions = db.transactions.filter(r => !r.deleted);
        const removed = beforeCount - (db.locations.length + db.items.length + db.transactions.length);
        if (removed > 0) logSync('强制同步：清理本地 ' + removed + ' 条墓碑');

        syncConfig.lastSync = 0;
        saveSyncConfig();
        logSync('强制同步：清空云端记录…');
        // 优先走 API 代理；404 时回退直连 Supabase DELETE
        let delOk = false;
        if (!_directMode) {
            try {
                const delUrl = '/api/sync-delete?_=' + Date.now();
                const delResp = await fetch(delUrl, { method: 'POST', cache: 'no-store' });
                if (delResp.ok || delResp.status === 204) {
                    delOk = true;
                } else if (delResp.status === 404) {
                    _directMode = true;
                    logSync('API 删除代理不可用（404），切换直连 Supabase');
                } else {
                    const txt = await delResp.text();
                    throw new Error('清空云端失败：' + delResp.status + ' ' + txt);
                }
            } catch (e) {
                if (e.message && e.message.includes('清空云端')) throw e;
                _directMode = true;
                logSync('API 删除代理异常，切换直连 Supabase');
            }
        }
        if (!delOk) {
            // 回退：直连 Supabase DELETE
            const baseUrl = syncConfig.url.replace(/\/$/, '');
            const delResp = await fetch(baseUrl + '/rest/v1/goods_records?id=not.is.null', {
                method: 'DELETE',
                cache: 'no-store',
                headers: {
                    'apikey': syncConfig.anonKey,
                    'Authorization': 'Bearer ' + syncConfig.anonKey
                }
            });
            if (!delResp.ok && delResp.status !== 204) {
                const txt = await delResp.text();
                throw new Error('清空云端失败：' + delResp.status + ' ' + txt);
            }
        }
        // Supabase 读写可能存在秒级副本延迟；删除后稍等再写入/读取，避免读到旧快照。
        await new Promise(r => setTimeout(r, 1500));
        logSync('强制同步：云端已清空，上传本机 ' + (db.locations.length + db.items.length + db.transactions.length) + ' 条记录');
        await pushToRemote();
        logSync('强制同步：上传完成，重新拉取');
        await new Promise(r => setTimeout(r, 1500));
        await pullFromRemote();
        // 若因副本延迟仍读到旧墓碑，等 2 秒再拉一次确认最终状态。
        const hasTombstone = (db.locations.some(r => r.deleted) || db.items.some(r => r.deleted) || db.transactions.some(r => r.deleted));
        if (hasTombstone) {
            logSync('强制同步：检测到延迟墓碑，2 秒后重试拉取');
            await new Promise(r => setTimeout(r, 2000));
            await pullFromRemote();
        }
        suppressAutoSync = true;
        save();
        suppressAutoSync = false;
        renderAll();
        syncConfig.lastSync = Date.now();
        saveSyncConfig();
        setSyncStatus('ok', '已同步 · ' + fmtClock());
        toast('已强制全量重新同步', 'success');
    } catch (e) {
        console.error('强制同步出错', e);
        setSyncStatus('error', (e && e.message) ? e.message : '强制同步出错');
    } finally {
        syncInProgress = false;
    }
}

// 诊断：对比本地与云端记录数，检测 RLS 是否挡住 select
async function diagnoseSync() {
    const box = document.getElementById('syncDiagResult');
    if (!box) return;
    box.style.display = 'block';
    const localCount = db.locations.length + db.items.length + db.transactions.length;
    if (!syncEnabled()) {
        box.textContent = `【未启用同步】\n本地记录总数：${localCount}（地点 ${db.locations.length} / 物品 ${db.items.length} / 交易 ${db.transactions.length}）\n\n请先点「启用同步」并填写正确的 Supabase URL 与 anon key。`;
        return;
    }
    box.textContent = '正在诊断…';
    try {
        // 拉取云端全部记录，统计行数 & 是否报错（主要检测 RLS 是否挡住 select）
        const { data, error, count } = await supabaseClient
            .from('goods_records')
            .select('*', { count: 'exact', head: false });
        if (error) {
            box.textContent = `【云端读取失败】\n错误：${error.message}\n\n这通常是 RLS（行级安全）挡住了 anon 的 SELECT 权限。\n请在 Supabase SQL Editor 执行：\n\n  alter table public.goods_records disable row level security;\n\n或在 Table Editor → RLS 里关闭该表的 RLS。`;
            return;
        }
        const cloudCount = data ? data.length : (count || 0);
        const cloudDeleted = data ? data.filter(r => r.data && r.data.deleted).length : 0;
        box.textContent =
`【诊断结果】
本地记录总数：${localCount}
  · 地点 ${db.locations.length}（含墓碑 ${db.locations.filter(l=>l.deleted).length}）
  · 物品 ${db.items.length}（含墓碑 ${db.items.filter(i=>i.deleted).length}）
  · 交易 ${db.transactions.length}（含墓碑 ${db.transactions.filter(t=>t.deleted).length}）
云端记录总数：${cloudCount}（其中墓碑 ${cloudDeleted}）

若本地≠云端：点「强制重新同步」让两端对齐。
若云端=0 而本地有数据：说明之前没成功上传，强制同步即可。
若云端读取失败：见上方 RLS 提示。`;
    } catch (e) {
        box.textContent = '诊断过程出错：' + (e && e.message ? e.message : e);
    }
}

function disconnectSync() {
    syncConfig.enabled = false;
    saveSyncConfig();
    supabaseClient = null;
    setSyncStatus('off');
    toast('已断开云同步（本地数据保留）', 'info');
}

// ---- Init ----
load();
bindEvents();
loadSyncConfig();
renderAll();

if (syncConfig.enabled && initSupabase()) {
    setSyncStatus('syncing', '同步中…');
    // 页面加载时仅拉取（不推送），避免本地陈旧/脏数据被推回云端覆盖干净数据。
    // 推送由 save 触发的 queueSync 或用户点「立即同步」负责。
    setTimeout(() => doSync(true), 800);
} else if (syncConfig.enabled) {
    setSyncStatus('error', 'Supabase 未加载');
} else {
    setSyncStatus('off');
}

// 切回前台 / 恢复联网时立即同步（仅拉取，不推送——避免本地陈旧数据覆盖云端）
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') doSync(true);
    else flushSync();   // 切到后台/关 App 前，立刻把本地改动推上去，避免防抖定时器被浏览器杀掉导致漏推
});
window.addEventListener('online', () => doSync(true));
// 页面卸载/隐藏时也尝试 flush，尽量保证改动已上传
window.addEventListener('pagehide', () => flushSync());
window.addEventListener('beforeunload', () => flushSync());

// 立刻（不防抖）推+拉一次：用于切后台/关闭前确保本地改动已上传
function flushSync() {
    if (!syncEnabled()) return;
    if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
    doSync();
}

// 周期性自动同步（每 30 秒，仅拉取兜底；推送由 save 触发的 queueSync 负责）
syncInterval = setInterval(() => { if (syncEnabled()) doSync(true); }, 30000);

</script>
